services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: fieldops-kafka

    ports:
      - "${KAFKA_PORT:-29092}:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: ${KAFKA_LISTENERS:-INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-INTERNAL://kafka:9092,EXTERNAL://localhost:29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN

      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME:?KAFKA_SASL_USERNAME must be set}" password="${KAFKA_SASL_PASSWORD:?KAFKA_SASL_PASSWORD must be set}" user_${KAFKA_SASL_USERNAME:?KAFKA_SASL_USERNAME must be set}="${KAFKA_SASL_PASSWORD:?KAFKA_SASL_PASSWORD must be set}" user_${KAFKA_PRODUCER_USERNAME:?KAFKA_PRODUCER_USERNAME must be set}="${KAFKA_PRODUCER_PASSWORD:?KAFKA_PRODUCER_PASSWORD must be set}" user_${KAFKA_DISPATCH_USERNAME:?KAFKA_DISPATCH_USERNAME must be set}="${KAFKA_DISPATCH_PASSWORD:?KAFKA_DISPATCH_PASSWORD must be set}" user_${KAFKA_GPS_USERNAME:?KAFKA_GPS_USERNAME must be set}="${KAFKA_GPS_PASSWORD:?KAFKA_GPS_PASSWORD must be set}" user_${KAFKA_SLA_USERNAME:?KAFKA_SLA_USERNAME must be set}="${KAFKA_SLA_PASSWORD:?KAFKA_SLA_PASSWORD must be set}" user_${KAFKA_NOTIFICATIONS_USERNAME:?KAFKA_NOTIFICATIONS_USERNAME must be set}="${KAFKA_NOTIFICATIONS_PASSWORD:?KAFKA_NOTIFICATIONS_PASSWORD must be set}" user_${KAFKA_BILLING_USERNAME:?KAFKA_BILLING_USERNAME must be set}="${KAFKA_BILLING_PASSWORD:?KAFKA_BILLING_PASSWORD must be set}" user_${KAFKA_PAYMENT_USERNAME:?KAFKA_PAYMENT_USERNAME must be set}="${KAFKA_PAYMENT_PASSWORD:?KAFKA_PAYMENT_PASSWORD must be set}" user_${KAFKA_AUDIT_USERNAME:?KAFKA_AUDIT_USERNAME must be set}="${KAFKA_AUDIT_PASSWORD:?KAFKA_AUDIT_PASSWORD must be set}";'

      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?KAFKA_SASL_USERNAME must be set}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?KAFKA_SASL_PASSWORD must be set}

      KAFKA_PRODUCER_USERNAME: ${KAFKA_PRODUCER_USERNAME:?KAFKA_PRODUCER_USERNAME must be set}
      KAFKA_PRODUCER_PASSWORD: ${KAFKA_PRODUCER_PASSWORD:?KAFKA_PRODUCER_PASSWORD must be set}

      KAFKA_DISPATCH_USERNAME: ${KAFKA_DISPATCH_USERNAME:?KAFKA_DISPATCH_USERNAME must be set}
      KAFKA_DISPATCH_PASSWORD: ${KAFKA_DISPATCH_PASSWORD:?KAFKA_DISPATCH_PASSWORD must be set}

      KAFKA_GPS_USERNAME: ${KAFKA_GPS_USERNAME:?KAFKA_GPS_USERNAME must be set}
      KAFKA_GPS_PASSWORD: ${KAFKA_GPS_PASSWORD:?KAFKA_GPS_PASSWORD must be set}

      KAFKA_SLA_USERNAME: ${KAFKA_SLA_USERNAME:?KAFKA_SLA_USERNAME must be set}
      KAFKA_SLA_PASSWORD: ${KAFKA_SLA_PASSWORD:?KAFKA_SLA_PASSWORD must be set}

      KAFKA_NOTIFICATIONS_USERNAME: ${KAFKA_NOTIFICATIONS_USERNAME:?KAFKA_NOTIFICATIONS_USERNAME must be set}
      KAFKA_NOTIFICATIONS_PASSWORD: ${KAFKA_NOTIFICATIONS_PASSWORD:?KAFKA_NOTIFICATIONS_PASSWORD must be set}

      KAFKA_BILLING_USERNAME: ${KAFKA_BILLING_USERNAME:?KAFKA_BILLING_USERNAME must be set}
      KAFKA_BILLING_PASSWORD: ${KAFKA_BILLING_PASSWORD:?KAFKA_BILLING_PASSWORD must be set}

      KAFKA_PAYMENT_USERNAME: ${KAFKA_PAYMENT_USERNAME:?KAFKA_PAYMENT_USERNAME must be set}
      KAFKA_PAYMENT_PASSWORD: ${KAFKA_PAYMENT_PASSWORD:?KAFKA_PAYMENT_PASSWORD must be set}

      KAFKA_AUDIT_USERNAME: ${KAFKA_AUDIT_USERNAME:?KAFKA_AUDIT_USERNAME must be set}
      KAFKA_AUDIT_PASSWORD: ${KAFKA_AUDIT_PASSWORD:?KAFKA_AUDIT_PASSWORD must be set}

      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:ANONYMOUS"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR:-1}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-1}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-1}

      KAFKA_DISPATCH_CONSUMER_GROUP: ${KAFKA_DISPATCH_CONSUMER_GROUP:-fieldops-dispatch}
      KAFKA_GPS_CONSUMER_GROUP: ${KAFKA_GPS_CONSUMER_GROUP:-fieldops-gps}
      KAFKA_NOTIFICATIONS_CONSUMER_GROUP: ${KAFKA_NOTIFICATIONS_CONSUMER_GROUP:-fieldops-notifications}
      KAFKA_SLA_CONSUMER_GROUP: ${KAFKA_SLA_CONSUMER_GROUP:-fieldops-sla}
      KAFKA_BILLING_CONSUMER_GROUP: ${KAFKA_BILLING_CONSUMER_GROUP:-fieldops-billing}
      KAFKA_PAYMENT_CONSUMER_GROUP: ${KAFKA_PAYMENT_CONSUMER_GROUP:-fieldops-payment}
      KAFKA_AUDIT_CONSUMER_GROUP: ${KAFKA_AUDIT_CONSUMER_GROUP:-fieldops-audit}
      KAFKA_ANALYTICS_CONSUMER_GROUP: ${KAFKA_ANALYTICS_CONSUMER_GROUP:-fieldops-analytics}

    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092
          > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: fieldops-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      KAFKA_TOPICS: "${KAFKA_TOPICS:-fieldops.job.events,fieldops.gps.events,fieldops.sla.events,fieldops.notification.events,fieldops.billing.events,fieldops.payment.events,fieldops.audit.events}"
      KAFKA_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
      KAFKA_JOB_EVENTS_PARTITIONS: "${KAFKA_JOB_EVENTS_PARTITIONS:-6}"
      KAFKA_GPS_EVENTS_PARTITIONS: "${KAFKA_GPS_EVENTS_PARTITIONS:-12}"
      KAFKA_SLA_EVENTS_PARTITIONS: "${KAFKA_SLA_EVENTS_PARTITIONS:-6}"
      KAFKA_NOTIFICATION_EVENTS_PARTITIONS: "${KAFKA_NOTIFICATION_EVENTS_PARTITIONS:-6}"
      KAFKA_BILLING_EVENTS_PARTITIONS: "${KAFKA_BILLING_EVENTS_PARTITIONS:-3}"
      KAFKA_PAYMENT_EVENTS_PARTITIONS: "${KAFKA_PAYMENT_EVENTS_PARTITIONS:-3}"
      KAFKA_AUDIT_EVENTS_PARTITIONS: "${KAFKA_AUDIT_EVENTS_PARTITIONS:-6}"
      KAFKA_JOB_EVENTS_RETENTION_MS: "${KAFKA_JOB_EVENTS_RETENTION_MS:-2592000000}"
      KAFKA_GPS_EVENTS_RETENTION_MS: "${KAFKA_GPS_EVENTS_RETENTION_MS:-604800000}"
      KAFKA_SLA_EVENTS_RETENTION_MS: "${KAFKA_SLA_EVENTS_RETENTION_MS:-2592000000}"
      KAFKA_NOTIFICATION_EVENTS_RETENTION_MS: "${KAFKA_NOTIFICATION_EVENTS_RETENTION_MS:-1209600000}"
      KAFKA_BILLING_EVENTS_RETENTION_MS: "${KAFKA_BILLING_EVENTS_RETENTION_MS:-7776000000}"
      KAFKA_PAYMENT_EVENTS_RETENTION_MS: "${KAFKA_PAYMENT_EVENTS_RETENTION_MS:-7776000000}"
      KAFKA_AUDIT_EVENTS_RETENTION_MS: "${KAFKA_AUDIT_EVENTS_RETENTION_MS:-15552000000}"

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        set -eu

        get_partitions() {
          case "$$1" in
            fieldops.job.events) echo "$$KAFKA_JOB_EVENTS_PARTITIONS" ;;
            fieldops.gps.events) echo "$$KAFKA_GPS_EVENTS_PARTITIONS" ;;
            fieldops.sla.events) echo "$$KAFKA_SLA_EVENTS_PARTITIONS" ;;
            fieldops.notification.events) echo "$$KAFKA_NOTIFICATION_EVENTS_PARTITIONS" ;;
            fieldops.billing.events) echo "$$KAFKA_BILLING_EVENTS_PARTITIONS" ;;
            fieldops.payment.events) echo "$$KAFKA_PAYMENT_EVENTS_PARTITIONS" ;;
            fieldops.audit.events) echo "$$KAFKA_AUDIT_EVENTS_PARTITIONS" ;;
            *) echo "Unknown topic: $$1" >&2; return 1 ;;
          esac
        }
        get_retention_ms() {
          case "$$1" in
            fieldops.job.events) echo "$$KAFKA_JOB_EVENTS_RETENTION_MS" ;;
            fieldops.gps.events) echo "$$KAFKA_GPS_EVENTS_RETENTION_MS" ;;
            fieldops.sla.events) echo "$$KAFKA_SLA_EVENTS_RETENTION_MS" ;;
            fieldops.notification.events) echo "$$KAFKA_NOTIFICATION_EVENTS_RETENTION_MS" ;;
            fieldops.billing.events) echo "$$KAFKA_BILLING_EVENTS_RETENTION_MS" ;;
            fieldops.payment.events) echo "$$KAFKA_PAYMENT_EVENTS_RETENTION_MS" ;;
            fieldops.audit.events) echo "$$KAFKA_AUDIT_EVENTS_RETENTION_MS" ;;
            *) echo "Unknown topic: $$1" >&2; return 1 ;;
          esac
        }
        validate_retention() {
          case "$$1" in
            ''|*[!0-9]*)
              echo "Invalid retention.ms value: $$1" >&2
              return 1
              ;;
            0)
              echo "retention.ms must be greater than zero." >&2
              return 1
              ;;
          esac
        }
        IFS=','
        for topic in $$KAFKA_TOPICS; do
          topic=$$(echo "$$topic" | xargs)

          if [ -z "$$topic" ]; then
            continue
          fi

          partitions=$$(get_partitions "$$topic")
          retention_ms=$$(get_retention_ms "$$topic")
          validate_retention "$$retention_ms"

          if /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafka:9092 \
              --describe \
              --topic "$$topic" > /tmp/topic-info 2>/dev/null; then

            current_partitions=$$(grep -o 'PartitionCount:[[:space:]]*[0-9]*' /tmp/topic-info | head -1 | grep -o '[0-9]*')

            if [ -n "$$current_partitions" ] && [ "$$current_partitions" -lt "$$partitions" ]; then
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --alter \
                --topic "$$topic" \
                --partitions "$$partitions"
            fi
            /opt/kafka/bin/kafka-configs.sh \
              --bootstrap-server kafka:9092 \
              --entity-type topics \
              --entity-name "$$topic" \
              --alter \
              --add-config "retention.ms=$$retention_ms"
          else
            /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafka:9092 \
              --create \
              --if-not-exists \
              --topic "$$topic" \
              --partitions "$$partitions" \
              --replication-factor "$$KAFKA_REPLICATION_FACTOR" \
              --config "retention.ms=$$retention_ms"
          fi
        done

volumes:
  kafka_data: