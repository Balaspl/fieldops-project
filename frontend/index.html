<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png?v=7" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FieldOps Commander — Field Operations Management System" />
  <title>FieldOps Commander</title>
  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
  ></script>
  <script>
    // Intercept and suppress the Google Maps API warning/billing popup alert
    (function () {
      const originalAlert = window.alert;
      window.alert = function (message) {
        if (message && (
          message.indexOf("Google Maps") !== -1 ||
          message.indexOf("can't load Google Maps correctly") !== -1 ||
          message.indexOf("billing") !== -1
        )) {
          console.warn("Suppressed Google Maps developer popup alert:", message);
          return;
        }
        originalAlert(message);
      };

      // Watch for the custom HTML modal popup that Google Maps injects into the DOM
      document.addEventListener("DOMContentLoaded", function () {
        const observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            mutation.addedNodes.forEach(function (node) {
              if (node.nodeType === 1) { // Element node
                const text = node.textContent || "";
                if (text.indexOf("can't load Google Maps correctly") !== -1 || text.indexOf("This page can't load Google Maps correctly") !== -1) {
                  // Click any OK button to dismiss Google Maps modal state
                  const dismissBtn = node.querySelector(".dismissButton") || node.querySelector("button");
                  if (dismissBtn) {
                    try {
                      dismissBtn.click();
                    } catch (e) { }
                  }
                  // Forcefully hide the overlay element
                  node.style.display = "none";
                  node.style.visibility = "hidden";
                  node.style.opacity = "0";
                  node.style.pointerEvents = "none";
                }
              }
            });
          });
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
